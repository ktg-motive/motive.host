<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bayside Surety — Homepage Directions</title>
  <style>
    :root{--ink:#1b1817;--crimson:#8d1c2c;--crimson-deep:#6e1522;--rose:#b9848a;--paper:#faf9f7;--line:#3a3533;}
    *{box-sizing:border-box;}
    html,body{margin:0;height:100%;}
    body{display:flex;flex-direction:column;font-family:"Libre Franklin",system-ui,-apple-system,Arial,sans-serif;background:var(--ink);color:var(--paper);}
    .bar{flex:0 0 auto;background:var(--ink);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;padding:.85rem 1.5rem;}
    .brand{display:flex;flex-direction:column;line-height:1.2;}
    .brand b{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:1.15rem;letter-spacing:.01em;}
    .brand span{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--rose);margin-top:2px;}
    .tabs{display:flex;gap:.5rem;margin-left:auto;flex-wrap:wrap;}
    .tab{font-family:inherit;font-size:.85rem;font-weight:600;color:var(--paper);background:transparent;border:1px solid var(--line);border-radius:4px;padding:.55rem .9rem;cursor:pointer;display:inline-flex;align-items:center;gap:.5rem;transition:background .12s,border-color .12s;}
    .tab:hover{border-color:var(--rose);}
    .tab.active{background:var(--crimson);border-color:var(--crimson-deep);}
    .tab em{font-style:normal;font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--rose);}
    .tab.active em{color:#fff;opacity:.85;}
    .open{font-size:.78rem;font-weight:600;color:var(--rose);text-decoration:none;white-space:nowrap;}
    .open:hover{color:#fff;}
    .note{flex:0 0 auto;margin:0;padding:.6rem 1.5rem;font-size:.82rem;color:#cfc9c6;background:#241f1e;border-bottom:1px solid var(--line);}
    .note b{color:var(--paper);}
    iframe{flex:1 1 auto;width:100%;border:0;background:var(--paper);}
    @media (max-width:720px){.tabs{width:100%;margin-left:0;}.open{display:none;}}
  </style>
</head>
<body>
  <header class="bar">
    <div class="brand"><b>Bayside Surety</b><span>Homepage directions · prepared by Motive AI</span></div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-src="conversion-forward.html" data-note="&lt;b&gt;Conversion-Forward (recommended).&lt;/b&gt; The inquiry form sits above the fold, the phone leads, and the ask repeats down the page. Built for the person who needs a bond today.">Conversion-Forward <em>Recommended</em></button>
      <button class="tab" data-src="institutional.html" data-note="&lt;b&gt;Classic Institutional.&lt;/b&gt; Centered and formal, with credentials right under the hero and one restrained crimson band. Reads like an established firm.">Classic Institutional</button>
      <button class="tab" data-src="editorial-boutique.html" data-note="&lt;b&gt;Editorial Boutique.&lt;/b&gt; A quiet, magazine-style hero that leads with the story. The most premium feel, and deliberately the softest on the call and quote.">Editorial Boutique</button>
    </nav>
    <a class="open" id="openFull" href="conversion-forward.html" target="_blank" rel="noopener">Open full page ↗</a>
  </header>
  <p class="note" id="note"><b>Conversion-Forward (recommended).</b> The inquiry form sits above the fold, the phone leads, and the ask repeats down the page. Built for the person who needs a bond today.</p>
  <iframe id="frame" src="conversion-forward.html" title="Homepage mockup"></iframe>
  <script>
    var tabs = document.getElementById('tabs');
    var frame = document.getElementById('frame');
    var note = document.getElementById('note');
    var openFull = document.getElementById('openFull');
    tabs.addEventListener('click', function (e) {
      var btn = e.target.closest('.tab');
      if (!btn) return;
      for (var t of tabs.querySelectorAll('.tab')) t.classList.remove('active');
      btn.classList.add('active');
      var src = btn.getAttribute('data-src');
      frame.src = src;
      openFull.href = src;
      note.innerHTML = btn.getAttribute('data-note');
    });
  </script>
</body>
</html>
